name: lsp-proof-min

on:
  push:
    branches: [ "lsp-proof-min" ]
  workflow_dispatch:

jobs:
  windows-min:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm via corepack
        run: corepack enable && pnpm --version
      - name: Install deps
        run: pnpm install --ignore-scripts --frozen-lockfile=false
      - name: Run minimal real-process proof
        run: node --import ./scripts/tsx.mjs scripts/lsp-proof-min.mts
      - name: Verify vitest real-process environment on Windows
        run: pnpm exec vitest run src/process/owned-stdio.real.test.ts 

  linux-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm via corepack
        run: corepack enable && pnpm --version
      - name: Install deps
        run: pnpm install --ignore-scripts --frozen-lockfile=false
      - name: Run shipped-entry LSP cleanup proof over real child processes
        run: node --import ./scripts/tsx.mjs scripts/lsp-proof-real.mts || true
      - name: Run diagnostic probe
        run: node --import ./scripts/tsx.mjs scripts/lsp-proof-diag.mts
      - name: Verify Linux real-process supervisor via owned-stdio real test
        run: pnpm exec vitest run src/process/owned-stdio.real.test.ts 
